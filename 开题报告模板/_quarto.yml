project:
  type: default
  output-dir: output

format:
  pdf:
    pdf-engine: xelatex
    documentclass: ctexart
    classoption:
      - fontset=none
      - zihao=-4
    include-in-header: header.tex
    template-partials:
      - before-body.tex
    toc: false
    number-sections: true
    cite-method: citeproc
    csl: 金融研究.csl
    bibliography: references.bib
    papersize: a4
    keep-tex: false
